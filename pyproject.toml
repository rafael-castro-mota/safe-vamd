[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-vamd"
version = "0.1.0"
description = "A sample Python package"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Rafael Castro Mota", email = "rafael.castro-mota@ptb.de"},
    {name = "Stefan Jacob", email = "stefan.jacob@ptb.de"},
    {name = "Paul Williams", email = "paul.williams@uts.edu.au"}
]

dependencies = [
    "matplotlib>=3.8.2",
    "numpy>=1.26.3",
    "scipy>=1.15.2"
]

[tool.setuptools.packages.find]
where = ["src"]